name: 'Release'

# A release tag (v1.0.0, v1.0.0-beta1) builds that release's images and drafts
# its GitHub Release. It publishes nothing an installation acts on: release.json
# is signed offline and reaches the `release` branch by hand, and the draft is
# published by hand, both after the checks in docs/RELEASING.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/hivepaas/hivepaas
  AGENT_IMAGE: ghcr.io/hivepaas/hivepaas-agent

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'

      - name: Version and channel
        id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=true channel=beta; else prerelease=false channel=stable; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: The tag is the version compiled into the binary
        run: RELEASE_TAG="$GITHUB_REF_NAME" go test -count=1 -run TestReleaseTagIsTheCompiledVersion ./hivepaas_app/base/

      - name: The dashboard has the same tag
        run: |
          git ls-remote --exit-code --tags https://github.com/hivepaas/hivepaas-dashboard.git "refs/tags/$GITHUB_REF_NAME" >/dev/null ||
            { echo "::error::hivepaas-dashboard has no tag $GITHUB_REF_NAME: tag the dashboard first"; exit 1; }

      - name: The installer pins a release verifier
        run: |
          grep -Eq "^VERIFY_IMAGE='?ghcr\.io/hivepaas/release-verify@sha256:[0-9a-f]{64}'?$" deployment/release/install.sh ||
            { echo "::error::install.sh pins no release verifier (VERIFY_IMAGE): run the Release verifier workflow and pin its digest"; exit 1; }

      # The binary is built with release.json as it is: every image it names,
      # but the app's and the agent's, is pinned now. Those two are this run's
      # to build, and a rebuild under the same tag finds an older build there.
      - name: The release's images are pinned
        run: go run ./tools/releasepin -check -deps

      - name: Test
        run: go test -count=1 ./...

      - name: Test the installer
        working-directory: deployment/release
        run: |
          shellcheck -x install.sh install_test.sh install_e2e.sh
          shellcheck ../../scripts/release/bake-install-ref.sh
          bash install_test.sh

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: check
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: ghcr.io/hivepaas/hivepaas, dockerfile: deployment/release/Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { image: ghcr.io/hivepaas/hivepaas, dockerfile: deployment/release/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: ghcr.io/hivepaas/hivepaas-agent, dockerfile: deployment/release/Dockerfile.agent, arch: amd64, runner: ubuntu-24.04 }
          - { image: ghcr.io/hivepaas/hivepaas-agent, dockerfile: deployment/release/Dockerfile.agent, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DASHBOARD_REF=${{ github.ref_name }}
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ matrix.image }}:${{ needs.check.outputs.version }}-${{ matrix.arch }}

  manifest:
    name: Multi-arch images
    needs: [check, build]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The version's tag never moves once pushed. The channel's tag (beta, or
      # stable and latest) follows the newest release of the channel; release.json
      # names images by version and digest, never by these.
      - name: Create the manifests
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CHANNEL: ${{ needs.check.outputs.channel }}
        run: |
          for image in "$APP_IMAGE" "$AGENT_IMAGE"; do
            tags=(-t "$image:$VERSION" -t "$image:$CHANNEL")
            if [ "$CHANNEL" = stable ]; then tags+=(-t "$image:latest"); fi
            docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          done

      - name: Record the digests
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          {
            echo "appImage=$APP_IMAGE:$VERSION@$(digest "$APP_IMAGE:$VERSION")"
            echo "agentImage=$AGENT_IMAGE:$VERSION@$(digest "$AGENT_IMAGE:$VERSION")"
          } > digests.txt
          {
            echo '### Images'
            echo '```'
            cat digests.txt
            echo '```'
            echo 'Copy these into release.json (docs/RELEASING.md).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests
          path: digests.txt

  draft:
    name: Draft the GitHub Release
    needs: [check, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests
          path: dist

      # The installer attached here deploys the stack of this tag; the copy in
      # the repository reads main.
      - name: Prepare the files
        run: |
          scripts/release/bake-install-ref.sh deployment/release/install.sh dist/install.sh "$GITHUB_REF_NAME"
          cp deployment/release/install.env dist/install.env
          (cd dist && sha256sum install.sh install.env digests.txt > SHA256SUMS)

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          args=(--draft --verify-tag --generate-notes --title "HivePaaS $GITHUB_REF_NAME")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            dist/install.sh dist/install.env dist/digests.txt dist/SHA256SUMS
