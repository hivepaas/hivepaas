syntax = "proto3";

package agent;

option go_package = "github.com/hivepaas/hivepaas/hivepaas_app/interface/agent/proto;agentproto";

service ContainerService {
  // ContainerExec starts a command execution in a container and pipes stdout/stderr/stdin/resize.
  rpc ContainerExec(stream ContainerExecReq) returns (stream ContainerExecResp);

  // ContainerCopyFrom extracts a file or directory archive from a container.
  rpc ContainerCopyFrom(ContainerCopyFromReq) returns (stream ContainerCopyFromResp);

  // ContainerCopyTo uploads a tar stream into a container.
  rpc ContainerCopyTo(stream ContainerCopyToReq) returns (ContainerCopyToResp);
}

message ContainerExecReq {
  oneof value {
    ContainerExecConfig config = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message ContainerExecConfig {
  string container_id = 1;
  repeated string cmd = 2;
  repeated string env = 3;
  string working_dir = 4;
  bool tty = 5;
  TerminalSize console_size = 6;
}

message TerminalSize {
  uint32 width = 1;
  uint32 height = 2;
}

message ContainerExecResp {
  oneof value {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
    bool can_retry = 4;
  }
}

message ContainerCopyFromReq {
  string container_id = 1;
  string path = 2;
  bool is_dir = 3;
  string compression_format = 4;
}

message ContainerCopyFromResp {
  bytes chunk = 1;
  string file_name = 2;
  int64 file_size = 3;
  string content_type = 4;
}

message ContainerCopyToReq {
  oneof value {
    ContainerCopyToMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message ContainerCopyToMetadata {
  string container_id = 1;
  string dst_path = 2;
  bool allow_overwrite_dir_with_file = 3;
  bool copy_uid_gid = 4;
}

message ContainerCopyToResp {
  bool success = 1;
  string message = 2;
}



