services:
  frontend:
    image: crccheck/hello-world:latest
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_frontend
      local_net:
    ports:
      - target: 80 # Container port
        published: 8000 # Host port
        protocol: tcp
        mode: host
    deploy:
      labels:
        - "hivepaas.app.key=frontend"
        - "hivepaas.app.name=frontend"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        compress: "true"

  backend:
    image: crccheck/hello-world:latest
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_backend
      local_net:
    deploy:
      labels:
        - "hivepaas.app.key=backend"
        - "hivepaas.app.name=backend"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        compress: "true"

  db:
    image: crccheck/hello-world:latest
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_db
      local_net:
    deploy:
      labels:
        - "hivepaas.app.key=db"
        - "hivepaas.app.name=db"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        compress: "true"

networks:
  hivepaas_net:
    external: true
  local_net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1380
