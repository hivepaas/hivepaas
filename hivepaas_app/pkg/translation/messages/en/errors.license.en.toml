# Messages for the errors declared in hivepaas_app/hperrors/errors_license.go.
# Adding or removing an error there means editing this file.

# A limit of 0 is a kind the plan leaves out, such as Bee's paid sign-in
# providers, where removing one would free nothing.
ERR_PLAN_LIMIT_REACHED = "{{if .Max}}The {{.PlanName}} plan allows {{.Max}} {{.LimitName}}. Remove one, or upgrade.{{else}}The {{.PlanName}} plan does not include {{.LimitName}}. Upgrade to add one.{{end}}"
ERR_LICENSE_INVALID = "This license key could not be verified"
ERR_LICENSE_OTHER_INSTALLATION = "This license key is for another installation. This installation's ID is {{.InstallationID}}."
ERR_LICENSE_EXPIRED = "This license key has expired"
ERR_LICENSE_SIGNING_KEY_INVALID = "License signing key is misconfigured"
ERR_LICENSE_PORTAL_UNAVAILABLE = "The license portal could not be reached"
ERR_LICENSE_PORTAL_REFUSED = "The license portal refused to check this license key"

# What ERR_PLAN_LIMIT_REACHED calls each limit, as its LimitName
# (license.LimitNameMsgID). They are not errors: they carry the ERR_ prefix
# because tools/errcodelint keeps only ids of that form in step with Go.
ERR_PLAN_LIMIT_NODES = "nodes"
ERR_PLAN_LIMIT_USERS = "users"
ERR_PLAN_LIMIT_APPS = "apps"
ERR_PLAN_LIMIT_FUNCTIONS = "functions"
ERR_PLAN_LIMIT_PREVIEWS = "previews at a time"
ERR_PLAN_LIMIT_SIGN_IN_PROVIDERS = "Google, Microsoft or OpenID Connect sign-in providers"
