services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.swarm=true"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.network=hivepaas_net"
      - "--providers.swarm.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.allowacmebypass=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # Liveness endpoint for the healthcheck below.
      #
      # Its own entrypoint rather than the api one, and bound to loopback. Sharing
      # the api entrypoint would tie traefik staying alive to api.insecure staying
      # on, so an operator turning the dashboard off would have swarm start killing
      # a perfectly healthy traefik. Loopback is enough because the check runs
      # inside the container, and it keeps /ping off the overlay network.
      #
      # These three are on the unsettable list in base/traefik.go: reachable only
      # from inside, and not removable through the traefik settings UI.
      - "--entrypoints.ping.address=127.0.0.1:8082"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log=true"
      - "--log.level=DEBUG"
      - "--accesslog=true"
    # Traefik had neither a healthcheck nor an update_config, which made every
    # UpdateFailureActionRollback the code sets on this service inert - swarm's
    # default monitor is 5s, so an update was called converged before anything
    # could go wrong. update_config below is the half with real teeth.
    #
    # What the check itself adds is narrower, and worth stating honestly: an
    # entrypoint that cannot bind makes traefik exit (verified - "address already
    # in use" is a fatal error, not a degraded start), and a task that exits is
    # something swarm already sees. This catches the case swarm cannot: the
    # process alive with its HTTP server wedged, in steady state as well as
    # during an update. It does NOT verify that any router works - /ping answers
    # the same whether or not the swarm provider found a single service.
    #
    # wget rather than `traefik healthcheck`: the CLI has to be handed the same
    # three ping flags as the command above to find the endpoint, and a port
    # changed in one place but not the other would have swarm killing a healthy
    # traefik. One URL is one thing to keep in step.
    #
    #   never becomes healthy: start_period + retries * interval = 60 + 90 = 150s
    #   healthy, then breaks:  retries * interval                =       90s
    #
    # Both fit inside monitor. Traefik starts in a second or two, so 60s is
    # already generous; it is kept tighter than the app's 120s because traefik
    # being wrong takes every ingress down with it, and the rollback verdict is
    # worth having sooner.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/ping"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_traefik
    ports:
      # Expose traefik's entry points to the Swarm
      # Swarm requires the long syntax for ports.
      - target: 80 # Container port
        published: 80 # Host port exposed on the nodes
        protocol: tcp
        # 'host' mode binds directly to the node's IP where the task runs.
        # 'ingress' mode uses Swarm's Routing Mesh (load balances across nodes).
        # Choose based on your load balancing strategy. 'host' is often simpler if using an external LB.
        mode: host
      - target: 443 # Container port
        published: 443 # Host port
        protocol: tcp
        mode: host
      - target: 8080 # Traefik dashboard
        published: 38081 # Exposed dashboard
        protocol: tcp
        mode: host
    volumes:
      - ./hivepaas/traefik/etc:/etc/traefik
      - ./hivepaas/traefik/var/log:/var/log/traefik
      - ./hivepaas/ssl/certs:/etc/traefik/ssl/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"traefik\",\"key\":\"traefik\"}"
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
      update_config:
        failure_action: rollback
        monitor: 180s
        max_failure_ratio: 0.5
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  db:
    image: postgres:18-alpine
    networks:
      - local_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hivepaas" ]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      POSTGRES_DB: hivepaas
      POSTGRES_USER: hivepaas
      POSTGRES_PASSWORD: abc123
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - db:/var/lib/postgresql
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"db\",\"key\":\"db\"}"
        - "traefik.enable=false"
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - local_net
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"redis\",\"key\":\"redis\"}"
        - "traefik.enable=false"
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  adminer:
    image: adminer:latest
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_adminer
      local_net:
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"adminer\",\"key\":\"adminer\"}"
        - "traefik.enable=true"
        - "traefik.http.routers.adminer.rule=Host(`adminer.dev.hivepaas.com`)"
        - "traefik.http.routers.adminer.entrypoints=websecure"
        - "traefik.http.routers.adminer.tls=true"
        - "traefik.http.routers.adminer-http.rule=Host(`adminer.dev.hivepaas.com`)"
        - "traefik.http.routers.adminer-http.entrypoints=web"
        - "traefik.http.services.adminer.loadbalancer.server.port=8080"
        - "traefik.swarm.network=hivepaas_net"
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  app:
    image: hivepaas/hivepaas-dev:latest
    stop_grace_period: 10m
    # Swarm's UpdateFailureActionRollback, which the update paths in the code set,
    # only fires when Swarm can tell an update failed. Without a healthcheck it
    # cannot: a container that starts and then serves nothing counts as converged,
    # so the rollback those code paths rely on never runs. This is what arms it.
    #
    # The check is also a liveness probe for the whole life of the container, not
    # only during an update - Swarm restarts a task that turns unhealthy. That is
    # wanted, but it means a check that is too strict restarts a working install,
    # which is the very outcome all of this exists to avoid. Hence the tolerance:
    # 5s to answer a static handler, and three consecutive misses before acting.
    #
    # The intervals are split because the two jobs want opposite things. During
    # startup, checking often makes a healthy task converge in seconds so updates
    # are not held up. Afterwards, twice a minute is plenty and costs nothing.
    #
    # start_period is deliberately generous rather than tight. It is not a delay:
    # docker ends it the moment the first check passes, so with start_interval at
    # 5s a task that is ready at 12s converges at 15s whether this says 45s or
    # 120s. What the number actually sets is how long a slow start is tolerated
    # before it counts as a failure, so it has to cover the slowest legitimate
    # boot - the first one, where SystemInstallation creates the admin user, the
    # default settings and the root project - not the typical one. Sizing it to
    # the typical boot turns "slow but fine" into "rolled back".
    #
    # For the same reason, do not try to shorten it at runtime once installation
    # is done. healthcheck lives in TaskTemplate.ContainerSpec, so writing it is a
    # task-level change and swarm answers by recreating the task: the app would
    # restart itself right after starting. It would also overwrite PreviousSpec,
    # pointing `docker service rollback` at this file instead of at the previous
    # release, and the next stack deploy would set it back and restart again.
    #
    # The numbers have to line up with update_config.monitor below, or the whole
    # arrangement is decoration:
    #
    #   never becomes healthy: start_period + retries * interval = 120 + 90 = 210s
    #   healthy, then breaks:  retries * interval                =        90s
    #
    # Both have to fit inside monitor, or Swarm calls the update converged before
    # a broken task can be marked unhealthy, and it is never rolled back.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:10000/_/ping"]
      start_period: 120s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      hivepaas_net:
        aliases:
          - hivepaas_app
      local_net:
    environment:
      HP_CONFIG_FILE: config/config.development.toml
      HP_STORAGE_BIND_SOURCE: ${PWD}/hivepaas
      HP_USER_ADMIN_USERNAME: admin
      HP_USER_ADMIN_EMAIL: admin@domain.name
      HP_USER_ADMIN_PASSWORD: abc123
      HP_AGENT_SECRET_TOKEN: abc123
    volumes:
      - ${PWD}/hivepaas:/var/lib/hivepaas
      - ${PWD}/hivepaas:/host${PWD}/hivepaas
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"app\",\"key\":\"app\"}"
        - "traefik.enable=true"
        - "traefik.http.services.app-svc.loadbalancer.server.port=10000"
        - "traefik.http.routers.app-router.rule=Host(`app.dev.hivepaas.com`)"
        - "traefik.http.routers.app-router.entrypoints=websecure"
        - "traefik.http.routers.app-router.tls=true"
        - "traefik.http.routers.app-router.service=app-svc"
        - "traefik.http.middlewares.app-router-compress.compress=true"
        - "traefik.http.middlewares.app-router-compress.compress.defaultencoding=br"
        - "traefik.http.middlewares.app-router-compress.compress.minresponsebodybytes=1024"
        - "traefik.http.routers.app-router.middlewares=app-router-compress@swarm"
        - "traefik.http.routers.x-custom-router-acme.rule=PathPrefix(`/.well-known/acme-challenge/`)"
        - "traefik.http.routers.x-custom-router-acme.entrypoints=web"
        - "traefik.http.routers.x-custom-router-acme.tls=false"
        - "traefik.http.middlewares.x-custom-addprefix-acme.addprefix.prefix=/acme"
        - "traefik.http.routers.x-custom-router-acme.middlewares=x-custom-addprefix-acme@swarm"
        - "traefik.swarm.network=hivepaas_net"
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      # 180s leaves room over the 135s worst case computed above. Erring long only
      # delays the verdict; erring short removes it.
      update_config:
        failure_action: rollback
        monitor: 240s
        max_failure_ratio: 0.5
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  worker:
    image: hivepaas/hivepaas-dev:latest
    stop_grace_period: 10m
    # The worker serves no port, so there is nothing to probe over HTTP. Instead
    # it refreshes a file with a unix timestamp every 15s, and only while it can
    # still reach the database - see InitWorkerHeartbeat. This check reads that
    # timestamp; a worker whose process is up but stuck stops refreshing it.
    #
    # restart_policy below only ever notices a process that exits, and
    # applyServiceSettingsToWorkerService sets UpdateFailureActionRollback on this
    # service, which without a healthcheck can never fire: swarm counts a worker
    # that starts and then does nothing as converged. This is what arms both.
    #
    # date/cat/[ are busybox builtins, so nothing here depends on a tool the
    # alpine image might drop. Missing, empty and malformed all read as 0, which
    # is never recent - verified against busybox, not assumed.
    #
    #   never becomes healthy: start_period + retries * interval = 120 + 90 = 210s
    #   healthy, then breaks:  staleness + retries * interval    = 60 + 90 = 150s
    #
    # Both fit inside update_config.monitor.
    healthcheck:
      test: ["CMD-SHELL", "HB=$$(cat /tmp/hivepaas-worker.alive 2>/dev/null); [ $$(( $$(date +%s) - $${HB:-0} )) -lt 60 ]"]
      start_period: 120s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - local_net
    environment:
      HP_CONFIG_FILE: config/config.development.toml
      HP_RUN_MODE: worker
      HP_USER_ADMIN_USERNAME: admin
      HP_USER_ADMIN_EMAIL: admin@domain.name
      HP_USER_ADMIN_PASSWORD: abc123
      HP_AGENT_SECRET_TOKEN: abc123
    volumes:
      - ${PWD}/hivepaas:/var/lib/hivepaas
      - ${PWD}/hivepaas:/host${PWD}/hivepaas
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"worker\",\"key\":\"worker\"}"
        - "traefik.enable=false"
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
      # applyServiceSettingsToWorkerService sets FailureAction and
      # MaxFailureRatio on this service every time worker settings change, but it
      # never sets Monitor - and swarm's default for it is 5s, far too short for
      # any healthcheck to have answered. Setting it here is what makes that
      # rollback real; the code preserves whatever it finds.
      update_config:
        failure_action: rollback
        monitor: 240s
        max_failure_ratio: 0.5
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  updater:
    image: hivepaas/hivepaas-dev:latest
    stop_grace_period: 10m
    networks:
      - local_net
    environment:
      HP_CONFIG_FILE: config/config.development.toml
      HP_RUN_MODE: updater
    volumes:
      - ${PWD}/hivepaas:/var/lib/hivepaas
      - ${PWD}/hivepaas:/host${PWD}/hivepaas
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      labels:
        - "hivepaas.app.info={\"name\":\"updater\",\"key\":\"updater\"}"
        - "traefik.enable=false"
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
          - node.labels.hivepaas.role == control-plane
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 50m
        compress: "true"

  agent:
    image: hivepaas/hivepaas-agent-dev:latest
    stop_grace_period: 10m
    environment:
      HP_CONFIG_FILE: config/config.development.toml
      HP_RUN_MODE: agent
      HP_AGENT_PORT: "10001"
      HP_AGENT_NODE_ID: "{{.Node.ID}}"
      HP_AGENT_NODE_NAME: "{{.Node.Hostname}}"
      HP_AGENT_SECRET_TOKEN: abc123
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
    networks:
      - local_net
    deploy:
      mode: global
      endpoint_mode: dnsrr
      labels:
        - "hivepaas.app.info={\"name\":\"agent\",\"key\":\"agent\"}"
        - "traefik.enable=false"
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
    logging:
      driver: local
      options:
        max-size: 20m
        compress: "true"

networks:
  hivepaas_net:
    external: true
  local_net:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1380

volumes:
  db:
    driver: local
