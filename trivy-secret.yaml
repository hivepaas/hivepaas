# Secrets Trivy finds that are in the repository on purpose. Trivy reads this
# file from the directory it scans, so the repository's scan
# (.github/workflows/go.yml) and `make trivy` both apply it.
#
# Every rule names the files it allows, never a kind of secret everywhere.
allow-rules:
  # The development license signing keys: public on purpose, trusted only by a
  # binary in the development environment (tools/licensesign/devkeys/README.md).
  - id: licensesign-devkeys
    description: The development license signing keys, public on purpose
    path: ^tools/licensesign/devkeys/dev-(ed|ml)\.key$
