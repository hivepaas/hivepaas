name: E2E

# The end-to-end tests against a throwaway HivePaaS, which e2e/env/up.sh makes on
# the runner: the backend and app-templates checked out beside the dashboard, as
# it expects them, built, and run inside dind. Levels 0 and 1 on every push and
# pull request; every level every night - when the backend may have moved - and
# by hand.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 19 * * *" # 02:00 in Vietnam
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            HP_E2E_BASE_URL: http://localhost:10100
            # The API bodies test reads the backend's request types from here.
            HP_BACKEND_DIR: ${{ github.workspace }}/hivepaas
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: hivepaas-dashboard
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: hivepaas/hivepaas
                  path: hivepaas
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: hivepaas/app-templates
                  path: app-templates

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: hivepaas/go.mod
                  cache-dependency-path: hivepaas/go.sum
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # The release image builds the dashboard on node:26.
                  node-version: "26"
                  cache: yarn
                  cache-dependency-path: |
                      hivepaas-dashboard/yarn.lock
                      hivepaas-dashboard/e2e/yarn.lock

            - name: The backend's devtools image, which migrates the database
              working-directory: hivepaas
              run: make init
            - name: The dashboard's packages
              working-directory: hivepaas-dashboard
              run: yarn install --frozen-lockfile
            - name: The tests' packages, and their browser
              working-directory: hivepaas-dashboard/e2e
              run: |
                  yarn install --frozen-lockfile
                  npx playwright install --with-deps chromium
            - name: A throwaway HivePaaS
              working-directory: hivepaas-dashboard/e2e
              run: ./env/up.sh

            - name: Levels 0 and 1
              if: github.event_name == 'push' || github.event_name == 'pull_request'
              working-directory: hivepaas-dashboard/e2e
              run: yarn test tests/level-0 tests/level-1
            - name: Every level
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              working-directory: hivepaas-dashboard/e2e
              run: yarn test

            - name: What the backend and its agent logged
              if: failure()
              run: |
                  docker exec hp-e2e-dind tail -n 400 /hp/app.log || true
                  docker exec hp-e2e-dind tail -n 100 /hp/agent.log || true
            - name: The report, with each failed test's trace, screenshot and video
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: |
                      hivepaas-dashboard/e2e/playwright-report
                      hivepaas-dashboard/e2e/test-results
                  retention-days: 14
            - name: Down
              if: always()
              working-directory: hivepaas-dashboard/e2e
              run: ./env/down.sh
