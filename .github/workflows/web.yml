name: Web

# What a pull request must keep working: the dashboard type-checks, lints and
# builds - with the lockfile as it is and the release image's Node - and the
# end-to-end tests' package type-checks. A dependency update that breaks either
# fails here, not after it is merged. The end-to-end tests themselves need a
# HivePaaS to run against: web-e2e.yml makes one, and runs them.

on:
    push:
        branches: [main]
        paths: ["web/**", ".github/workflows/web.yml"]
    pull_request:
        branches: [main]
        paths: ["web/**", ".github/workflows/web.yml"]

permissions:
    contents: read

jobs:
    dashboard:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # The release image builds the dashboard on node:26
                  # (deployment/release/Dockerfile).
                  node-version: "26"
                  cache: yarn
                  cache-dependency-path: web/yarn.lock
            - run: yarn install --frozen-lockfile
            - run: yarn lint:ci
            - run: yarn build

    e2e:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web/e2e
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "26"
                  cache: yarn
                  cache-dependency-path: web/e2e/yarn.lock
            - run: yarn install --frozen-lockfile
            - run: yarn typecheck
