# Deployed with hivepaas.yaml when the stack is first deployed on this server.
#
# The app is held back with no replicas while install.sh migrates the database
# and gives every service its OOM priority - each such update restarts the
# service - and is then started once: its first boot, which creates the admin
# and asks for the dashboard's certificate, runs with nothing left to restart
# it. A later deploy leaves this file out, and the app runs as hivepaas.yaml
# has it.
#
# The admin's account is not in any service's environment: the first boot
# reads it from <app data>/first-boot.env, and deletes it.
services:
  app:
    deploy:
      replicas: 0
