syntax = "proto3";

package agent;

option go_package = "github.com/hivepaas/hivepaas/hivepaas_app/interface/agent/proto;agentproto";

service ImageBuildService {
  // ImageBuildFromSource builds an image from the source sent in the call: the
  // request first, then the packed source in chunks. The agent unpacks it in a
  // temporary directory of its own and removes it when the call ends.
  rpc ImageBuildFromSource(stream ImageBuildMsg) returns (stream ImageBuildResp);
}

message ImageBuildMsg {
  oneof value {
    ImageBuildReq req = 1;   // first, once
    bytes source_chunk = 2;  // then the source (tar, zstd), in order
  }
}

message ImageBuildReq {
  string task_id = 1;
  string app_id = 2;
  string commit_hash = 3;
  DeploymentDockerfile dockerfile = 4;
  reserved 5;                  // was image_name, now a function of the app
  reserved "image_name";
  string push_to_registry_id = 6;
  ImageBuildSettings image_build_settings = 7;
  bool no_cache = 8;
  string build_id = 9;
  reserved 10, 11;             // were checkout_dir and temp_dir: the agent has its own
  reserved "checkout_dir", "temp_dir";
  // Tags this one deployment asked for, without the environment prefix, which
  // the build adds. An agent older than the server ignores them and pushes the
  // commit tag alone.
  repeated string image_tags = 12;
}

message DeploymentDockerfile {
  string source = 1;
  string path = 2;
  string content = 3;
  string scan_path = 4;
}

message ImageBuildSettings {
  ImageBuildWorkerSettings workers = 1;
  ImageBuildResourceSettings resources = 2;
  ImageBuildSourceSettings sources = 3;
  bool no_cache = 4;
  bool no_verbose = 5;
}

message ImageBuildWorkerSettings {
  repeated string node_ids = 1;
  repeated string node_labels = 2;
  uint32 max_parallelism = 3;
}

message ImageBuildResourceSettings {
  uint32 cpus = 1;
  uint64 mem = 2;
  uint64 mem_swap = 3;
  uint64 shm_size = 4;
}

message ImageBuildSourceSettings {
  bool repo_cache = 1;
}

message ImageBuildResp {
  oneof value {
    LogFrame log = 1;
    ImageBuildResult result = 2;
  }
}

message LogFrame {
  string type = 1;
  string data = 2;
  int64 ts = 3;
}

message ImageBuildResult {
  repeated string image_tags = 1;
}
