name: 'Placeholder'

# Builds the image a new app runs until its first deployment
# (tools/placeholder), for amd64 and arm64, and pushes it to GHCR, on a tag
# placeholder-vX.Y.Z - the release environment accepts no branch. release.json
# pins it by digest as placeholderImage: a new one reaches installations with
# the next release that names it (see docs/RELEASING.md).

on:
  push:
    tags:
      - 'placeholder-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hivepaas/placeholder

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'

      - name: Test the placeholder
        run: go test -count=1 ./tools/placeholder/

      - name: Version
        id: meta
        run: |
          version=${GITHUB_REF_NAME#placeholder-v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version is X.Y.Z, not '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/release/Dockerfile.placeholder
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      - name: What to put in release.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Pin it in release.json'
            echo '```'
            echo "\"placeholderImage\": \"$IMAGE:$VERSION@$DIGEST\","
            echo '```'
            echo 'or set the tag and run `make release-pin`.'
          } >> "$GITHUB_STEP_SUMMARY"
