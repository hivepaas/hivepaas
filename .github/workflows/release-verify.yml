name: 'Release verifier'

# Builds the image the installer checks release.signed.json with
# (tools/releaseverify), for amd64 and arm64, and pushes it to GHCR. Run it by
# hand, or with a tag verify-v<N>, only when the release keys or the signature
# format change: installers pin the image by digest, so a new one reaches them
# only through install.sh (VERIFY_IMAGE, VERIFY_KEYS; see docs/RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The image tag, e.g. 1'
        required: true
  push:
    tags:
      - 'verify-v[0-9]+'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hivepaas/release-verify

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'

      - name: Test the verifier
        run: go test -count=1 ./tools/releaseverify/ ./hivepaas_app/pkg/releasesig/...

      - name: Version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=${INPUT_VERSION:-${GITHUB_REF_NAME#verify-v}}
          [[ $version =~ ^[0-9]+$ ]] || { echo "::error::the version is a number, not '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/release/Dockerfile.verify
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      - name: What to put in install.sh
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          fingerprint=$(go run ./tools/releaseverify -fingerprint)
          {
            echo '### Pin it in deployment/release/install.sh'
            echo '```'
            echo "VERIFY_IMAGE=$IMAGE@$DIGEST"
            echo "VERIFY_KEYS=$fingerprint"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
