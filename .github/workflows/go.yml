name: 'Go Source Check'

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['*']

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.27.x"]
        include:
          - go: 1.27.x
            latest: true

    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load cached dependencies
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Dependencies
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.0

      - name: Lint
        run: make lint-local

      - name: Test
        run: make test-cover

  # docs/openapi/swagger.json is the API's contract - the CLI is generated from it
  # - and its generation is deterministic: regenerating it changes nothing unless
  # a change was committed without `make gen-swag`.
  openapi:
    name: OpenAPI spec is current
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install swag
        # The version the devtools image runs, so that CI and `make gen-swag` agree.
        run: |
          version=$(grep -o 'swag/v2/cmd/swag@[^ ]*' tools/docker/Dockerfile | cut -d@ -f2)
          go install "github.com/swaggo/swag/v2/cmd/swag@${version}"

      - name: Regenerate the spec
        run: SWAG_BIN="$(go env GOPATH)/bin/swag" ./tools/swag/swag.sh

      - name: Compare with the committed spec
        # The spec, the API level beside it and base.APILevel, which `make gen-swag`
        # writes together.
        run: |
          if ! git diff --exit-code --stat docs/openapi hivepaas_app/base/api_level_gen.go; then
            echo "::error file=docs/openapi/swagger.json::not current: run make gen-swag and commit the result"
            exit 1
          fi

      # What the CLI does with the spec: an id or an enum value given twice is a
      # client that does not compile, which nothing else here would notice.
      - name: Generate a Go client from the spec and build it
        run: ./tools/swag/check-client.sh

  # The CLI is a client generated from this spec, in its own repository. Its
  # `make spec-check SPEC=<file>` regenerates the client from the spec given and
  # builds and tests it: a change here that breaks the CLI fails here, in the
  # pull request that makes it. Until the CLI has the target, there is nothing
  # to check.
  cli-compat:
    name: The CLI builds against this API
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: hivepaas

      - name: Checkout the CLI
        uses: actions/checkout@v7
        with:
          repository: hivepaas/hivepaas-cli
          path: hivepaas-cli

      - name: Check the CLI against this spec
        run: |
          if ! make -C hivepaas-cli -n spec-check SPEC=x >/dev/null 2>&1; then
            echo "::notice::hivepaas-cli has no spec-check target yet: nothing to check"
            exit 0
          fi
          make -C hivepaas-cli spec-check SPEC="${GITHUB_WORKSPACE}/hivepaas/docs/openapi/swagger.json"

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27.x'
          go-package: './...'

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A HIGH or CRITICAL flaw with a fix fails the build. One reviewed and
      # accepted goes in .trivyignore, with why and until when.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'fs'
          scan-ref: '.'
          skip-dirs: 'vendor,.temp,tmp,temp'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

